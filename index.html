<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Date Invitation</title>
    <style>
        body {
            margin: 0;
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #ff9a9e, #fad0c4);
            text-align: center;
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        h1 {
            font-size: 50px;
            margin-bottom: 30px;
        }

        .buttons {
            display: flex;
            gap: 20px;
            position: relative;
            align-items: center;
            height: 100px;
        }

        button {
            padding: 15px 30px;
            border: none;
            border-radius: 25px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            transition: transform 0.2s;
        }

        #yes-btn {
            background-color: #00e676;
            color: white;
        }

        #yes-btn:hover {
            transform: scale(1.1);
        }

        #no-btn {
            background-color: #ff5c8a;
            color: white;
            position: absolute;
            left: 150px; 
            top: 0px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Will you go out with me? ❤️</h1>
        <div class="buttons">
            <button id="yes-btn" onclick="accept()">Yes 😍</button>
            <button id="no-btn" onmouseover="moveButton()">No 😢</button>
        </div>
    </div>

    <script>
        function accept() {
            alert("Yay! Looking forward to it! 🥰");
        }

        function moveButton() {
            const noBtn = document.getElementById("no-btn");
            const currentLeft = parseInt(noBtn.style.left) || 150;
            const currentTop = parseInt(noBtn.style.top) || 0;
            
            // Randomly move within a small area
            const newLeft = currentLeft + (Math.random() - 0.5) * 100;
            const newTop = currentTop + (Math.random() - 0.5) * 100;
            
            // Keep it within the viewport
            noBtn.style.left = Math.max(50, Math.min(newLeft, window.innerWidth - 150)) + 'px';
            noBtn.style.top = Math.max(50, Math.min(newTop, window.innerHeight - 100)) + 'px';
        }
    </script>

</body>
</html>
